# ANYKPI — local / self-host via Docker Compose.
#
#   docker compose up
#
# Pulls the published multi-arch image ghcr.io/dillon-wyrld/anykpi.
# SQLite lives in the named volume `anykpi-data` at /data — data survives
# container recreation (`docker compose down`). Use `docker compose down -v`
# only if you intend to wipe the database.
#
# Local build fallback (unreleased tree, or GHCR not pulled yet):
#   uncomment `build: .` under the service, then `docker compose up --build`
#
# This service is always-on (`restart: unless-stopped`). Overnight is the
# zero-traffic window — a template that sleeps silently voids the freshness
# promise at the deploy step. The committed one-click host is Railway
# (railway.toml): always-on + persistent volume at /data.
#
# If a future template targets an auto-stop host, it must wire an
# external-cron recipe to POST /api/v1/sync instead of assuming in-process
# freshness. Do not add a second host template here.
#
# Demo workspace stays public-read. Set ANYKPI_API_KEY before connecting
# live data or performing writes.

services:
  anykpi:
    image: ghcr.io/dillon-wyrld/anykpi
    # build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /data/anykpi.db
      ANYKPI_API_KEY: ${ANYKPI_API_KEY:-}
      ANYKPI_SECRET: ${ANYKPI_SECRET:-}
    volumes:
      - anykpi-data:/data
    restart: unless-stopped

volumes:
  anykpi-data:
