name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-cli:
    name: Build, pack, and publish @anykpi/cli
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @anykpi/cli
        run: pnpm --filter @anykpi/cli build

      - name: Pack @anykpi/cli
        run: pnpm --filter @anykpi/cli pack

      - name: Publish @anykpi/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set. Skipping npm publish."
            echo "Claim the anykpi npm org and add the NPM_TOKEN repository secret before the first v* tag that should publish."
            exit 0
          fi
          echo "Publishing @anykpi/cli to npm..."
          pnpm --filter @anykpi/cli publish --access public --no-git-checks

  publish-image:
    name: Build and push multi-arch image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dillon-wyrld/anykpi
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
