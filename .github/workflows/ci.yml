name: CI

on:
  push:
    branches: [main, "cursor/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: anykpi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++
      
      # onlyBuiltDependencies in package.json lets pnpm compile better-sqlite3
      # during install, so no manual native-build step is needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit
        env:
          ANYKPI_DB_ENGINE: ${{ matrix.engine }}

      - name: Schema drift
        run: pnpm exec vitest run src/core/schema-drift.test.ts

      - name: Build
        run: pnpm build

      - name: Build CLI
        run: pnpm --filter @anykpi/cli build

      - name: Typecheck SDK consumer
        run: pnpm sdk:consumer-types

      - name: Initialize database
        run: pnpm db:init
        env:
          DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgres://postgres:postgres@localhost:5432/anykpi' || '' }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      
      # ANY-67: tests/zz-real-workspace-gate.spec.ts is the "fully functional" definition.
      - name: Run E2E tests (real-workspace gate + existing suite)
        run: pnpm test:e2e
        env:
          ANYKPI_API_KEY: anykpi-e2e-admin
          DATABASE_URL: ${{ matrix.engine == 'postgres' && 'postgres://postgres:postgres@localhost:5432/anykpi' || '' }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.engine }}
          path: test-results/
          retention-days: 7
