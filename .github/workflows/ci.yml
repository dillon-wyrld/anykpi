name: CI

on:
  push:
    branches: [main, "cursor/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 10
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++
      
      # onlyBuiltDependencies in package.json lets pnpm compile better-sqlite3
      # during install, so no manual native-build step is needed.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Initialize database
        run: pnpm db:init

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Build CLI
        run: pnpm --filter @anykpi/cli build

      - name: Typecheck SDK consumer
        run: pnpm sdk:consumer-types

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      
      - name: Run E2E tests (includes CLI smoke)
        run: pnpm test:e2e
        env:
          ANYKPI_API_KEY: anykpi-e2e-admin
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
